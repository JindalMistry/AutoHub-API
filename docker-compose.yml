services:
  postgres:
    image: postgres:17

    container_name: autohub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    
    ports:
      - "5342:5432"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine

    container_name: autohub-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data
  
  minio:
    image: minio/minio

    container_name: autohub-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data: