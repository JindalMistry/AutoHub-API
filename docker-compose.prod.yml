services:
  api:
    build:
      context: .
      dockerfile: AutoHub.API/Dockerfile

    container_name: autohub-api

    ports:
      - "5000:8080"
    
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
     
      ConnectionStrings__DefaultConnection: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}

      Jwt__Secret: ${JWT_SECRET}

      Redis__ConnectionString: ${REDIS_CONNECTION}

      Minio__Endpoint: ${MINIO_ENDPOINT}
      Minio__AccessKey: ${MINIO_ACCESS_KEY}
      Minio__SecretKey: ${MINIO_SECRET_KEY}
      Minio__BucketName: ${MINIO_BUCKET}
      Minio__UseSSL: ${MINIO_USE_SSL}

      Hangfire__Username: ${HANGFIRE_USERNAME}
      Hangfire__Password: ${HANGFIRE_PASSWORD}

    depends_on:
      - postgres
      - redis
      - minio