name: Autohub-API Deployment

on:
  push:
    branches:
      - 'release/*'
  
  workflow_dispatch:
 
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello from Github Actions"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Check .NET Version
        run: dotnet --info

      - name: Verify Repository
        run: |
          pwd
          ls -la
      
      - name: Restore NuGet Packages
        run: dotnet restore AutoHub.sln

      - name: Build Solution
        run: dotnet build AutoHub.sln --configuration Release --no-restore

      - name: Check for Test Projects
        run: dotnet test AutoHub.sln --configuration Release --no-build
      
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected successfully!"
            whoami
            pwd
            hostname